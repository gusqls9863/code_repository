<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추첨기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>로또 번호 추첨기</h1>
        <div class="lotto-numbers">
            <div class="number-group">
                <h2>당첨 번호</h2>
                <div id="winning-numbers" class="ball-container"></div>
            </div>
            <div class="number-group">
                <h2>보너스 번호</h2>
                <div id="bonus-number" class="ball-container"></div>
            </div>
        </div>
        <button id="generate-btn">번호 생성</button>

        <hr class="divider">

        <div class="contact-section">
            <h2>제휴 문의</h2>
            <form action="https://formspree.io/f/xeenjrvq" method="POST" id="contact-form">
                <div class="input-group">
                    <label for="name">성함 / 회사명</label>
                    <input type="text" id="name" name="name" required placeholder="예: 홍길동 / (주)파트너">
                </div>
                <div class="input-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
                </div>
                <div class="input-group">
                    <label for="subject">문의 제목</label>
                    <input type="text" id="subject" name="subject" required placeholder="제휴 문의 드립니다">
                </div>
                <div class="input-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="5" required placeholder="상세 내용을 입력해주세요"></textarea>
                </div>
                <input type="text" name="_gotcha" style="display:none">
                <button type="submit" id="submit-btn">문의하기</button>
            </form>
        </div>

        <hr class="divider">

        <div class="comments-section">
            <h2>댓글</h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
                /*
                var disqus_config = function () {
                this.page.url = window.location.href;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = window.location.pathname; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://lotto-generator-1.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>

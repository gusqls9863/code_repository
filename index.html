<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3419305218211773"
     crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추첨기 & AI 분류기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="nav-logo">로또 & AI</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">홈</a></li>
                <li><a href="lotto-guide.html">로또 가이드</a></li>
                <li><a href="ai-tech.html">AI 기술</a></li>
                <li><a href="about.html">소개</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <section class="tool-section">
            <h1>로또 번호 추첨기</h1>
            <p class="tool-description">행운의 번호를 무작위로 생성해보세요. 확률의 원리를 활용한 투명한 추첨 시스템입니다.</p>
            <div class="lotto-numbers">
                <div class="number-group">
                    <h2>당첨 번호</h2>
                    <div id="winning-numbers" class="ball-container"></div>
                </div>
                <div class="number-group">
                    <h2>보너스 번호</h2>
                    <div id="bonus-number" class="ball-container"></div>
                </div>
            </div>
            <button id="generate-btn">번호 생성</button>
        </section>

        <hr class="divider">

        <section class="tool-section">
            <h2>강아지 vs 고양이 AI 판별기</h2>
            <p class="tool-description">최신 인공지능 기술로 사진 속 동물을 판별합니다. 모든 분석은 기기 내에서 안전하게 이루어집니다.</p>
            <div class="upload-container">
                <input type="file" id="image-upload" accept="image/*" hidden>
                <button id="upload-btn">사진 올리기</button>
            </div>
            <div id="image-preview-container">
                <img id="preview-image" src="" alt="미리보기" style="display:none;">
            </div>
            <div id="loading-spinner" style="display:none;">모델 로딩 중...</div>
            <div id="result-label"></div>
            <div id="label-container"></div>
        </section>

        <hr class="divider">

        <div class="contact-section">
            <h2>제휴 문의</h2>
            <form action="https://formspree.io/f/xeenjrvq" method="POST" id="contact-form">
                <div class="input-group">
                    <label for="name">성함 / 회사명</label>
                    <input type="text" id="name" name="name" required placeholder="예: 홍길동 / (주)파트너">
                </div>
                <div class="input-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="_replyto" required placeholder="example@email.com">
                </div>
                <div class="input-group">
                    <label for="subject">문의 제목</label>
                    <input type="text" id="subject" name="subject" required placeholder="제휴 문의 드립니다">
                </div>
                <div class="input-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="5" required placeholder="상세 내용을 입력해주세요"></textarea>
                </div>
                <input type="text" name="_gotcha" style="display:none">
                <button type="submit" id="submit-btn">문의하기</button>
            </form>
        </div>

        <hr class="divider">

        <div class="comments-section">
            <h2>댓글</h2>
            <div id="disqus_thread"></div>
            <script>
                (function() { 
                var d = document, s = d.createElement('script');
                s.src = 'https://lotto-generator-1.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 로또 & AI 분류기. All rights reserved.</p>
            <div class="footer-links">
                <a href="privacy.html">개인정보처리방침</a> | 
                <a href="lotto-guide.html">로또 가이드</a> | 
                <a href="ai-tech.html">AI 기술</a> | 
                <a href="about.html">소개</a>
            </div>
        </div>
    </footer>

    <!-- TensorFlow.js 및 Teachable Machine 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
